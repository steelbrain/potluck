[package]
name = "potluck"
version = "0.1.2"
edition = "2024"
description = "A build and test cluster for a handful of Linux and macOS machines"
license = "MIT"
# Not published until the first release.
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.3"
libc = "0.2.191"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
ring = "0.17.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
unicase = "2.10.0"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
